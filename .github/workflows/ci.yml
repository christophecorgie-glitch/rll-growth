name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Tests hors ligne (données fictives, sockets bloqués) : aucun secret, aucun téléchargement des sources.
      - run: python3 -m pytest pipelines/fr-idf/tests
